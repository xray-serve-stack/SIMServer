[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SIMServer"
version = "1.0.0"
description = "SIMServe WebSocket server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "xray-serve-stack" }]
keywords = ["SIMServer"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = ["fastapi", "uvicorn[standard]", "websockets", "cryptography"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.16.0",
    "ruff>=0.12.0",
    "black",
    "pyright",
]

[project.urls]
Homepage = "https://github.com/xray-serve-stack/SIMServer"
Repository = "https://github.com/xray-serve-stack/SIMServer"
Issues = "https://github.com/xray-serve-stack/SIMServer/issues"
Documentation = "https://github.com/xray-serve-stack/SIMServer#readme"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simserver = ["py.typed"]

[project.scripts]
simserver = "simserver.main:main"
simserver-cli = "simserver.cli:main"


[tool.ruff]

target-version = "py313"
line-length = 111

[tool.ruff.lint]

select = [
    # pycodestyle
    "E",

    # Pyflakes
    "F",
]

# Future:
#
# "I"   Import sorting
# "UP"  Python upgrades
# "B"   Bugbear
# "SIM" Simplifications
# "PERF"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
